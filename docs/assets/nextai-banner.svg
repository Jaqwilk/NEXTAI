<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">NEXTAI — computational AI research</title>
  <desc id="desc">A dark research banner with a sparse amber path through computational nodes. The research goal is capability per unit of computation.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26313e" stroke-width=".6"/></pattern>
    <radialGradient id="halo"><stop stop-color="#d7a649" stop-opacity=".13"/><stop offset="1" stop-color="#d7a649" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="380" rx="16" fill="#101720"/>
  <rect x="656" y="20" width="520" height="320" fill="url(#grid)" opacity=".65"/>
  <ellipse cx="936" cy="190" rx="260" ry="175" fill="url(#halo)"/>
  <path d="M48 48h24" stroke="#e0b55e" stroke-width="3"/>
  <text x="84" y="53" fill="#e0b55e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">COMPUTATIONAL AI RESEARCH</text>
  <text x="44" y="163" fill="#f2f4f6" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="700" letter-spacing="-4">NEXT<tspan fill="#e0b55e">AI</tspan></text>
  <text x="48" y="217" fill="#f2f4f6" font-family="Arial, Helvetica, sans-serif" font-size="29">Intelligence per unit</text>
  <text x="48" y="255" fill="#f2f4f6" font-family="Arial, Helvetica, sans-serif" font-size="29">of computation.</text>
  <text x="48" y="322" fill="#9aa9ba" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1">A RESEARCH QUESTION. AN EXPERIMENTAL LABORATORY.</text>
  <g stroke="#36414c" stroke-width="1.2" fill="none"><path d="M744 96 840 64 936 96 1032 64 1128 96M744 96 840 160 936 96 1032 160 1128 96M744 224 840 160 936 224 1032 160 1128 224M744 224 840 288 936 224 1032 288 1128 224M744 96v128M840 64v224M936 96v128M1032 64v224M1128 96v128M840 64 1032 160M840 288 1032 160"/></g>
  <g fill="#17222d" stroke="#546170" stroke-width="1.5">
    <circle cx="744" cy="96" r="7"/><circle cx="840" cy="64" r="7"/><circle cx="936" cy="96" r="7"/><circle cx="1032" cy="64" r="7"/><circle cx="1128" cy="96" r="7"/>
    <circle cx="744" cy="224" r="7"/><circle cx="840" cy="288" r="7"/><circle cx="936" cy="224" r="7"/><circle cx="1032" cy="288" r="7"/>
  </g>
  <path d="M690 160H840L936 96 1032 160 1128 224" fill="none" stroke="#e0b55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e0b55e" stroke="#101720" stroke-width="4"><circle cx="690" cy="160" r="8"/><circle cx="840" cy="160" r="9"/><circle cx="936" cy="96" r="9"/><circle cx="1032" cy="160" r="9"/><circle cx="1128" cy="224" r="9"/></g>
  <circle cx="1032" cy="160" r="20" fill="none" stroke="#e0b55e" stroke-opacity=".3"/>
  <path d="M682 321h25" stroke="#e0b55e" stroke-width="2"/>
  <text x="718" y="326" fill="#9aa9ba" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">EXPLORE · MEASURE · FALSIFY</text>
