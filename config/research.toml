schema_version = 1

[project]
name = "NEXTAI Autoresearch"
objective = "Find computational principles that could improve capability per unit of end-to-end inference cost beyond dense autoregressive language models."
generation = 1
protocol_version = 2
benchmark_version = "heldout_mechanism_recombination_v6"
benchmark_status = "active"
timezone = "Europe/Warsaw"

[codex]
