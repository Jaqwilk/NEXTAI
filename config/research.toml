[decision]
minimum_screen_accuracy = 0.95
minimum_replication_seeds = 3
maximum_relative_seed_cv = 0.10
promotion_requires_screen = true
promotion_requires_non_dominated_result = true
promotion_requires_prior_art_check = true
promotion_requires_no_integrity_violation = true
promotion_requires_deep = true
promotion_requires_adversarial_variant = true
minimum_promotion_results = 2
falsification_requires_discriminating_test = true
minimum_scaling_points = 3

