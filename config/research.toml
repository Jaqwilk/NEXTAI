[execution]
mode = "audited_subprocess"
allow_network_in_candidate = false
require_source_audit = true
poll_interval_seconds = 0.10
kill_grace_seconds = 2.0
stale_lock_seconds = 7200
allow_legacy_fixed_seed_plans = false
allowed_import_roots = [
  "__future__",
  "abc",
  "collections",
  "dataclasses",
  "functools",
  "heapq",
  "itertools",
  "math",
  "nextai_autoresearch",
  "numpy",
  "random",
  "statistics",
  "typing",
]
forbidden_builtins = ["open", "eval", "exec", "compile", "__import__", "input"]

[budgets.quick]
wall_seconds_per_candidate = 180
max_rss_mb = 1536
knowledge_sizes = [8, 32]
reasoning_depths = [1]
queries_per_cell = 128
development_seeds = [1103]
scoring_seed_count = 1

[budgets.screen]
wall_seconds_per_candidate = 600
max_rss_mb = 4096
knowledge_sizes = [8, 32, 64]
reasoning_depths = [1]
queries_per_cell = 128
development_seeds = [1103, 2207, 3301]
scoring_seed_count = 3

[budgets.deep]
