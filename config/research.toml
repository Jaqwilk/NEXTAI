schema_version = 1

[project]
name = "NEXTAI Autoresearch"
objective = "Find computational principles that could improve capability per unit of end-to-end inference cost beyond dense autoregressive language models."
generation = 1
protocol_version = 2
benchmark_version = "heldout_three_family_continuous_transfer_v3"
benchmark_status = "active"
timezone = "Europe/Warsaw"

[codex]
# Codex is the only research agent. No OpenAI API client or external model is used.
one_bounded_cycle_per_scheduled_run = true
reflection_every_completed_experiments = 12
literature_review_every_completed_experiments = 6
maximum_new_hypotheses_per_cycle = 3

[transfer]
families = [
  "context_specific_probabilistic_circuit_v1",
  "action_conditioned_predictive_equivalence_v1",
  "nonlinear_local_state_transfer_v1",
  "behavioral_conjugacy_library_transfer_v1",
]
training_world_seeds = [1103, 2207, 3301]
shared_candidate = "shared_relation_fragment_graph"
independent_ablation = "independent_relation_fragment_graph"
specialist_baselines = [
  "specialist_contextual_chow_liu_suite_v2",
  "specialist_empirical_joint_suite_v2",
  "specialist_autoregressive_suite_v2",
  "oracle_cross_family_suite_v2",
]
declared_horizons = [1, 4, 16]
representation_interface = "lossless_family_neutral_structural_tokens_v2"
learner_contract = "anonymous_relation_fragment_graph_v1"
shared_slow_fit_scope = "pooled_training_worlds_only"
test_support_adaptation = "same_frozen_fragment_extractor_charged"
fragment_capacity = 64
composition_rule = "typed_equality_join_then_component_emit_v1"
permutation_equivariance = "atom_relabeling_and_anonymous_world_permutation"
state_budget_bytes = 4194304
invalidation_rules = [
  "Invalidate on any derived training and scoring seed collision.",
  "Invalidate if the shared candidate receives a family label or privileged native object.",
  "Invalidate if any training or test value is truncated, sampled or encoded by a family-specific rule.",
  "Invalidate if test results, targets or oracle fields are available during pooled meta-fit.",
  "Invalidate on candidate tuning after any scoring output is observed.",
  "Invalidate if the shared source dispatches on family, native type, slot identity or a hand-written ontology.",
  "Invalidate if the learner retrieves complete training examples without exposing fragment decomposition and a multi-fragment composition trace.",
]

[online_update]
mechanisms = ["mixed_linear", "mixed_quadratic", "mixed_periodic"]
training_stream_seeds = [1103, 2207]
shared_candidate = "shared_meta_update"
classical_baselines = [
  "no_update_online",
  "delta_lms_online",
  "rls_kalman_online",
  "polynomial_rls_online",
  "kernel_dictionary_online",
  "changepoint_bank_rls_online",
