[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nextai-autoresearch"
version = "0.2.0"
description = "Codex-native, falsification-first infrastructure for architectural AI research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
nextai = "nextai_autoresearch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
